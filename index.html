<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>双燃 · 自律锻炼竞赛</title>
  <meta name="theme-color" content="#f6f7f2" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand-block">
        <div class="brand-mark">SR</div>
        <div>
          <h1>双燃</h1>
          <p>两个人，一周一战</p>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span>首页</button>
        <button class="nav-item" data-view="record"><span>▣</span>记录</button>
        <button class="nav-item" data-view="report"><span>▤</span>战报</button>
        <button class="nav-item" data-view="rules"><span>◎</span>规则</button>
      </nav>
      <div class="season-card">
        <strong id="seasonTitle">本周赛程</strong>
        <span id="seasonRange">自动按自然周结算</span>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">异地无监督公平赛</h2>
        </div>
        <div class="leader-pill" id="leaderPill">计算中</div>
      </header>

      <section class="view active" id="dashboardView" data-title="本周对战">
        <div class="score-grid">
          <article class="score-card" id="maleScoreCard"></article>
          <div class="vs-badge">VS</div>
          <article class="score-card" id="femaleScoreCard"></article>
        </div>

        <div class="insight-strip" id="weeklyInsight"></div>

        <div class="dashboard-grid">
          <section class="panel">
            <div class="panel-head">
              <h3>今日状态</h3>
              <span id="recordCountLabel"></span>
            </div>
            <div class="today-grid" id="todayGrid"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>体脂相对变化</h3>
              <span>以周初为 0%</span>
            </div>
            <div class="trend-wrap">
              <canvas id="trendCanvas" width="680" height="260"></canvas>
              <div class="chart-tooltip" id="chartTooltip" role="status" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </section>

      <section class="view" id="recordView" data-title="今日记录">
        <div class="record-layout">
          <form class="panel record-form" id="recordForm">
            <div class="panel-head">
              <h3>晨起空腹数据</h3>
              <span id="ocrStatus">上传截图后自动识别</span>
            </div>

            <div class="segmented" role="tablist" aria-label="选择记录人">
              <button type="button" class="segment active" data-player="male">qiuke</button>
              <button type="button" class="segment" data-player="female">metoo</button>
            </div>

            <div class="form-grid">
              <label>日期<input id="dateInput" type="date" required /></label>
              <label>体重 kg<input id="weightInput" type="number" step="0.01" /></label>
              <label>体脂率 %<input id="fatInput" type="number" step="0.01" /></label>
              <label>骨骼肌 kg<input id="muscleInput" type="number" step="0.01" /></label>
              <label>基础代谢 kcal<input id="metabolismInput" type="number" step="1" /></label>
              <label>训练状态<select id="stateInput"><option>力量训练</option><option>有氧</option><option>拉伸</option><option>休息</option></select></label>
            </div>

            <label class="upload-box" for="imageInput">
              <input id="imageInput" type="file" accept="image/*" />
              <img id="imagePreview" alt="截图预览" />
              <span id="uploadText">上传体脂秤截图</span>
            </label>

            <textarea id="noteInput" rows="3" placeholder="备注，比如训练内容、饮食状态、身体感觉"></textarea>
            <button class="primary-btn" type="submit">保存今日记录</button>
          </form>

          <section class="panel">
            <div class="panel-head"><h3>本周数据</h3><span>截图留存</span></div>
            <div class="record-list" id="recordList"></div>
          </section>
        </div>
      </section>

      <section class="view" id="reportView" data-title="本周战报">
        <div class="winner-panel" id="winnerPanel"></div>
        <div class="breakdown-grid" id="breakdownGrid"></div>
      </section>

      <section class="view" id="rulesView" data-title="比赛规则">
        <form class="panel settings-form" id="settingsForm">
          <div class="panel-head"><h3>个人基础资料</h3><span>保存后作为长期基础资料</span></div>
          <div class="settings-grid">
            <label>qiuke昵称<input id="maleNameSetting" type="text" /></label>
            <label>qiuke年龄<input id="maleAgeSetting" type="number" step="1" /></label>
            <label>qiuke身高 cm<input id="maleHeightSetting" type="number" step="1" /></label>
            <label>qiuke初始体重 kg<input id="maleInitialWeightSetting" type="number" step="0.1" /></label>
            <label class="wide-field">qiuke目标<input id="maleGoalSetting" type="text" /></label>
            <label>metoo昵称<input id="femaleNameSetting" type="text" /></label>
            <label>metoo年龄<input id="femaleAgeSetting" type="number" step="1" /></label>
            <label>metoo身高 cm<input id="femaleHeightSetting" type="number" step="1" /></label>
            <label>metoo初始体重 kg<input id="femaleInitialWeightSetting" type="number" step="0.1" /></label>
            <label class="wide-field">metoo目标<input id="femaleGoalSetting" type="text" /></label>
          </div>
          <div class="panel-head sub-head"><h3>比赛规则参数</h3><span>直接影响每周计分</span></div>
          <div class="settings-grid">
            <label>qiuke修正系数<input id="maleFactorSetting" type="number" step="0.01" /></label>
            <label>metoo修正系数<input id="femaleFactorSetting" type="number" step="0.01" /></label>
            <label>qiuke体脂满分降幅 %<input id="maleFatFullSetting" type="number" step="0.1" /></label>
            <label>metoo体脂满分降幅 %<input id="femaleFatFullSetting" type="number" step="0.1" /></label>
            <label>qiuke肌肉满分涨幅 %<input id="maleMuscleFullSetting" type="number" step="0.1" /></label>
            <label>metoo肌肉满分涨幅 %<input id="femaleMuscleFullSetting" type="number" step="0.1" /></label>
            <label>qiuke体重健康浮动 %<input id="maleWeightBandSetting" type="number" step="0.1" /></label>
            <label>metoo体重健康浮动 %<input id="femaleWeightBandSetting" type="number" step="0.1" /></label>
          </div>
          <button class="primary-btn" type="submit">保存基础数据</button>
        </form>
        <div class="rules-grid">
          <article class="panel rule-card"><h3>体脂率优化 · 40 分</h3><p id="fatRuleText"></p></article>
          <article class="panel rule-card"><h3>骨骼肌增长 · 35 分</h3><p id="muscleRuleText"></p></article>
          <article class="panel rule-card"><h3>健康体重稳定 · 15 分</h3><p id="weightRuleText"></p></article>
          <article class="panel rule-card"><h3>基础代谢维持 · 10 分</h3><p>基础代谢上涨或持平 10 分，小幅下降小于 2% 得 4 分，下降大于等于 2% 为 0 分。</p></article>
          <article class="panel rule-card wide"><h3>性别修正</h3><p id="factorRuleText"></p></article>
        </div>
      </section>
    </main>

    <nav class="mobile-tabs" aria-label="移动端导航">
      <button class="mobile-tab active" data-view="dashboard">⌂<span>首页</span></button>
      <button class="mobile-tab" data-view="record">▣<span>记录</span></button>
      <button class="mobile-tab" data-view="report">▤<span>战报</span></button>
      <button class="mobile-tab" data-view="rules">◎<span>规则</span></button>
    </nav>

    <div class="modal-backdrop" id="recordModal" aria-hidden="true">
      <form class="modal-card" id="detailForm">
        <div class="modal-head">
          <div>
            <p class="modal-kicker" id="detailOwner">记录详情</p>
            <h3>校对 OCR 数据</h3>
          </div>
          <button class="icon-btn" type="button" id="closeDetailBtn">×</button>
        </div>
        <input id="detailPlayerKey" type="hidden" />
        <input id="detailOriginalDate" type="hidden" />
        <div class="form-grid">
          <label>日期<input id="detailDateInput" type="date" required /></label>
          <label>体重 kg<input id="detailWeightInput" type="number" step="0.01" /></label>
          <label>体脂率 %<input id="detailFatInput" type="number" step="0.01" /></label>
          <label>骨骼肌 kg<input id="detailMuscleInput" type="number" step="0.01" /></label>
          <label>基础代谢 kcal<input id="detailMetabolismInput" type="number" step="1" /></label>
          <label>训练状态<select id="detailStateInput"><option>力量训练</option><option>有氧</option><option>拉伸</option><option>休息</option></select></label>
        </div>
        <label class="upload-box detail-upload" for="detailImageInput">
          <input id="detailImageInput" type="file" accept="image/*" />
          <img id="detailImagePreview" alt="记录截图预览" />
          <span id="detailUploadText">重新上传截图并 OCR</span>
        </label>
        <p class="ocr-note" id="detailOcrStatus">可以手动修正 OCR 识别结果</p>
        <textarea id="detailNoteInput" rows="3" placeholder="备注，比如训练内容、饮食状态、身体感觉"></textarea>
        <div class="modal-actions">
          <button class="ghost-btn" type="button" id="deleteDetailBtn">删除记录</button>
          <button class="primary-btn" type="submit">保存修改</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
